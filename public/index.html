<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Student Task Manager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark">
  <div class="container">
    <a class="navbar-brand fw-bold" href="#"><i class="bi bi-check2-square me-2"></i>Student Task Manager</a>
  </div>
</nav>

<header class="hero">
  <div class="container">
    <p class="eyebrow">TPDS-III • MODULE 4</p>
    <h1>Plan. Track. <span>Complete.</span></h1>
    <p class="lead">A responsive task management application powered by Node.js, Express.js and Docker.</p>
  </div>
</header>

<main class="container py-5">
  <div id="alertBox"></div>

  <section class="card panel mb-4">
    <div class="card-body">
      <div class="section-title">
        <div>
          <p class="eyebrow">ADD TASK</p>
          <h2>Create a new task</h2>
        </div>
        <i class="bi bi-plus-circle"></i>
      </div>
      <form id="taskForm" class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Task title</label>
          <input id="title" class="form-control" placeholder="e.g. Complete DBMS assignment" required>
        </div>
        <div class="col-md-3">
          <label class="form-label">Priority</label>
          <select id="priority" class="form-select">
            <option>High</option>
            <option selected>Medium</option>
            <option>Low</option>
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label">Due date</label>
          <input id="dueDate" type="date" class="form-control">
        </div>
        <div class="col-12">
          <label class="form-label">Description</label>
          <textarea id="description" class="form-control" rows="2" placeholder="Optional details"></textarea>
        </div>
        <div class="col-12">
          <button class="btn btn-primary px-4"><i class="bi bi-plus-lg me-1"></i>Add Task</button>
        </div>
      </form>
    </div>
  </section>

  <section class="d-flex justify-content-between align-items-center mb-3">
    <div>
      <p class="eyebrow mb-1">YOUR TASKS</p>
      <h2 class="mb-0">Task List</h2>
    </div>
    <span id="countBadge" class="badge rounded-pill text-bg-light">0 tasks</span>
  </section>

  <section id="taskList" class="row g-3"></section>
</main>

<footer class="py-4 text-center">
  <small>Node.js • Express.js • Bootstrap 5 • Docker</small>
</footer>

<script src="script.js"></script>
</body>
</html>
